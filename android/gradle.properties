# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true

# Apenas arquiteturas de celulares reais (ARM). x86/x86_64 são só para emuladores
# e aumentavam bastante o tamanho do APK.
reactNativeArchitectures=armeabi-v7a,arm64-v8a
android.builder.sdkDownload=true

# Desabilitado conforme instrução do README.md para compatibilidade com ReactRootView no InputMethodService
newArchEnabled=false
hermesEnabled=true
